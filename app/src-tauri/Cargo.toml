[package]
name = "gitid-app"
description = "gitid desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Desktop only, so no [lib] / mobile entry point (see Tauri's template for that).

[features]
# The web inspector in release builds (right-click > Inspect Element). CI's
# test builds turn it on; releases must not (on macOS it uses private APIs).
# Debug builds (`npm run tauri dev`) always have it.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
gitid-core = { workspace = true, features = ["serde"] }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
