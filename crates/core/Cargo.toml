[package]
name = "gitid-core"
description = "Find out which git identity applies to a folder, and why."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Serialize the public types (for the Tauri app and `gitid --json`).
# Off by default so the core has no required dependencies.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
