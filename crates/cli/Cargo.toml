[package]
name = "gitid"
description = "Command-line front end for gitid-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "gitid"
path = "src/main.rs"

[dependencies]
gitid-core = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
