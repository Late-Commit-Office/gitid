[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]
# Plain `cargo build` / `cargo test` skip the app: it needs its frontend built
# first (app/dist) and, on Linux, WebKitGTK. Build it with `npm run tauri dev`
# or `npm run tauri build` from app/.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90" # Tauri's dialog plugin needs 1.90

[workspace.dependencies]
gitid-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Small, fast release builds (from Tauri's template).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
