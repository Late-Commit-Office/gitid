name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      # v5 runs on Node.js 24 (Node.js 20 actions are deprecated on GitHub runners).
      - uses: actions/checkout@v5
      # A composite action (no Node.js runtime), so no deprecation warning.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: git --version
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # --no-fail-fast: run every test binary even if an earlier one fails,
      # so one OS-specific problem doesn't hide the rest.
      - run: cargo test --no-fail-fast

      # ---- Test builds: downloadable from the run's summary page, not a release.
      - name: Build release binary
        run: cargo build --release -p gitid

      # Artifacts don't keep the Unix executable bit, so pack into a tar.gz
      # (Linux/macOS) or zip (Windows) first and upload that file as-is.
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/gitid-${{ matrix.name }}.tar.gz" -C target/release gitid
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/gitid.exe -DestinationPath "dist/gitid-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/gitid-${{ matrix.name }}.*
          # Upload the archive itself instead of wrapping it in another zip.
          archive: false
          retention-days: 14
          if-no-files-found: error
