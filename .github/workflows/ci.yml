name: CI

on:
  # Branches only: a pushed version tag runs release.yml, which runs this
  # file with `release: true`.
  push:
    branches: ["**"]
    # A push or PR that only changes these skips CI. The release
    # (release.yml, on tags) is unaffected and always builds.
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_call:
    inputs:
      release:
        description: Build for a release (no DevTools)
        type: boolean
        default: false

jobs:
  # Core + CLI: format, lint, test, and a downloadable CLI build per OS.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            # The command-only download is static (musl), so it runs on any
            # x86-64 Linux, however old its glibc: servers included.
            targets: x86_64-unknown-linux-musl
          # Universal: one file for Apple silicon and Intel Macs.
          - os: macos-latest
            name: macos-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # A composite action (no Node.js runtime).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - run: git --version
      - run: cargo fmt --all --check
      # The app is linted in the `app` job (it needs WebKitGTK on Linux and
      # its frontend built first).
      - run: cargo clippy --workspace --exclude gitid-app --all-targets -- -D warnings
      # --no-fail-fast: run every test binary even if an earlier one fails.
      # gitid-core/serde turns on the JSON contract tests the frontend relies on.
      - run: cargo test --workspace --exclude gitid-app --features gitid-core/serde --no-fail-fast

      # ---- Builds: downloadable from the run's summary page; release.yml
      # collects them into a draft release.
      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p gitid
      # Static: no system libraries needed, not even glibc. Copied to the
      # usual place for packaging. Fails if the result isn't static.
      - name: Build CLI (Linux, static)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p gitid --target x86_64-unknown-linux-musl
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/gitid target/release/gitid
          file target/release/gitid
          file target/release/gitid | grep -Eq 'statically linked|static-pie linked'
          target/release/gitid --version
      # Both Mac architectures, joined into one universal file at the usual place.
      - name: Build CLI (macOS, universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p gitid --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/gitid \
            target/aarch64-apple-darwin/release/gitid target/x86_64-apple-darwin/release/gitid
          lipo target/release/gitid -verify_arch arm64 x86_64 && lipo -info target/release/gitid
      # Artifacts don't keep the Unix executable bit, so pack into a tar.gz
      # (Linux/macOS) or zip (Windows) first and upload that file as-is.
      - name: Package CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/gitid-cli-${{ matrix.name }}.tar.gz" -C target/release gitid -C "$GITHUB_WORKSPACE" LICENSE
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/gitid.exe, LICENSE -DestinationPath "dist/gitid-cli-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/gitid-cli-${{ matrix.name }}.*
          archive: false
          retention-days: 14
          if-no-files-found: error

  # Desktop app: type-check, lint, and build test installers per OS.
  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 on purpose: the app then runs on Ubuntu 22.04+ (glibc and
          # webkit2gtk-4.1 floor), not just the newest release.
          - os: ubuntu-22.04
            name: linux-x64
            bundles: deb,appimage
            # The .deb and the AppImage are separate downloads.
            upload1: gitid-gui-cli-linux-x64.deb
            upload2: gitid-gui-cli-linux-x64.AppImage
          # Universal (Apple silicon and Intel). The bundled CLI is made
          # universal too, by scripts/build-sidecar.mjs.
          - os: macos-latest
            name: macos-universal
            bundles: app
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            upload1: gitid-gui-cli-macos-universal.tar.gz
          - os: windows-latest
            name: windows-x64
            bundles: nsis
            # The installer, and a portable zip of the same two programs.
            upload1: gitid-gui-cli-windows-x64-setup.exe
            upload2: gitid-gui-cli-windows-x64-portable.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies (from Tauri's prerequisites)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Uses the lockfile once one is committed; until then resolves fresh.
      - name: Install frontend dependencies
        shell: bash
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      # Localisation: no text written in the code, and every language has
      # every entry, with the same placeholders, translated from the current
      # English (see "Localisation" in the README).
      - run: npm run check:strings
      - run: npm run check:locales
      # Builds app/dist, which the Rust side embeds; clippy needs it to exist.
      - run: npm run build
      # The gitid CLI the installers ship (bundle > externalBin). The app's
      # build script needs it to exist too. `tauri build` below runs this
      # again (as beforeBuildCommand); by then it's cached.
      - run: npm run sidecar
      - run: cargo clippy -p gitid-app --all-targets -- -D warnings
      # The app's own tests (the JSON the rule form sends and receives).
      - run: cargo test -p gitid-app
      # Test builds get the web inspector (right-click > Inspect Element).
      # Releases don't: on macOS it relies on private APIs.
      - name: Build app
        run: npm run tauri build -- --ci --bundles ${{ matrix.bundles }} ${{ matrix.args }} ${{ !inputs.release && '--features devtools' || '' }}

      # Bundles land in the workspace's target/ folder (repo root).
      - name: Package app (Linux)
        if: runner.os == 'Linux'
        working-directory: target/release/bundle
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp deb/*.deb "$GITHUB_WORKSPACE/dist/${{ matrix.upload1 }}"
          cp appimage/*.AppImage "$GITHUB_WORKSPACE/dist/${{ matrix.upload2 }}"
      - name: Package app (macOS)
        if: runner.os == 'macOS'
        # A universal build lands under its target's folder.
        working-directory: target/universal-apple-darwin/release/bundle/macos
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # Ad-hoc signed (bundle > macOS > signingIdentity "-"): fail if the
          # signature doesn't hold, for the app and the CLI inside it.
          codesign --verify --deep --strict --verbose=2 gitid.app
          codesign -dv gitid.app/Contents/MacOS/gitid 2>&1 | grep -E 'Signature|Identifier'
          # Fail if either the app or its CLI is missing an architecture.
          for f in gitid.app/Contents/MacOS/gitid-app gitid.app/Contents/MacOS/gitid; do
            lipo "$f" -verify_arch arm64 x86_64 && lipo -info "$f"
          done
          tar -czf "$GITHUB_WORKSPACE/dist/${{ matrix.upload1 }}" gitid.app -C "$GITHUB_WORKSPACE" LICENSE
      # Portable: the app and the CLI that `tauri build` left in
      # target/release (the CLI as the bundled sidecar), with the license.
      - name: Package app (Windows)
        if: runner.os == 'Windows'
        working-directory: target/release
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE/dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item bundle/nsis/*-setup.exe "$dist/${{ matrix.upload1 }}"
          Compress-Archive -Path gitid-app.exe, gitid.exe, "$env:GITHUB_WORKSPACE/LICENSE" -DestinationPath "$dist/${{ matrix.upload2 }}"
      # One file per upload (archive: false takes a single file).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.upload1 }}
          archive: false
          retention-days: 14
          if-no-files-found: error
      - if: matrix.upload2
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.upload2 }}
          archive: false
          retention-days: 14
          if-no-files-found: error
